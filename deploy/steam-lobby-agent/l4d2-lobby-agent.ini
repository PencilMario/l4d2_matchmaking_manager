[program:l4d2-lobby-agent]
priority=60
autostart=true
autorestart=true
startsecs=2
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/opt/l4d2-agent/L4d2LobbyAgent
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",ASPNETCORE_URLS="%(ENV_ASPNETCORE_URLS)s",STEAM_LOBBY_PROBE_PATH="%(ENV_STEAM_LOBBY_PROBE_PATH)s",STEAM_API_LIBRARY_PATH="%(ENV_STEAM_API_LIBRARY_PATH)s",PROBE_TIMEOUT_SECONDS="%(ENV_PROBE_TIMEOUT_SECONDS)s"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/l4d2-lobby-agent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/l4d2-lobby-agent.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
