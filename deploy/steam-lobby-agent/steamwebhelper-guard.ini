[program:steamwebhelper-guard]
priority=70
autostart=false
autorestart=false
startsecs=0
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/local/bin/steamwebhelper-guard
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/home/%(ENV_USER)s/.cache/log/steamwebhelper-guard.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/home/%(ENV_USER)s/.cache/log/steamwebhelper-guard.err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
